name: HermesVoice
options:
  bundleIdPrefix: com.artbred
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: 8RK5YR2SLU
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "43"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.9.6
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.9.0
targets:
  HermesVoice:
    type: application
    platform: iOS
    sources:
      - path: HermesVoice
    dependencies:
      - package: SwiftSoup
      - package: SwiftMarkdown
        product: Markdown
    info:
      path: HermesVoice/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleName: Hermes
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Hermes Voice records your messages so your Hermes server can transcribe them and respond in a full agent conversation.
        NSLocalNetworkUsageDescription: Hermes Voice connects to your Hermes server when it runs on your local network.
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.artbred.hermesapp
            CFBundleURLSchemes:
              - hermesvoice
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artbred.hermesapp
        PRODUCT_NAME: HermesVoice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: HermesVoice/HermesVoice.entitlements
      properties:
        aps-environment: development
  HermesVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermesVoiceTests
    dependencies:
      - target: HermesVoice
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artbred.hermesapp.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HermesVoice:
    build:
      targets:
        HermesVoice: all
        HermesVoiceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: HermesVoiceTests
    archive:
      config: Release
