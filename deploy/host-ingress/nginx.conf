# No image default configuration or entrypoint scripts are used.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Leave size policy to the original Traefik/upstream; do not impose nginx's 1M.
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ignore_headers X-Accel-Buffering;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_redirect off;
    proxy_next_upstream off;
    # SSE: idle timeout, not a cap on the total response duration.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    server {
        listen 8642;
        location / {
            proxy_pass http://unix:/sockets/api.sock;
        }
    }
    server {
        listen 9120;
        location / {
            proxy_pass http://unix:/sockets/speech.sock;
        }
    }
    server {
        listen 9122;
        location / {
            proxy_pass http://unix:/sockets/uploads.sock;
        }
    }
    server {
        listen 9123;
        location / {
            proxy_pass http://unix:/sockets/push.sock;
        }
    }
}
