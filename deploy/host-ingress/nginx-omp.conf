# Same tested HTTP-to-Unix transport; one OMP broker endpoint on artbred.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_pass_request_headers on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ignore_headers X-Accel-Buffering;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_redirect off;
    proxy_next_upstream off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # Docker's embedded DNS is infrastructure, not an application upstream.
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream infisical_backend {
        zone infisical_backend 64k;
        server infisical-backend:8080 resolve;
    }
    server {
        listen 8765;
        location / {
            proxy_pass http://unix:/sockets/broker.sock;
        }
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://infisical_backend;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
